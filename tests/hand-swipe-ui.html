<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand swipe regression scenarios</title><link rel="stylesheet" href="../styles/game.css"><link rel="stylesheet" href="../styles/popup.css"><link rel="stylesheet" href="../styles/arena.css"><main style="max-width:650px;padding:24px;margin:auto"><h1>Hand swipe regression</h1><p>Test-only setup: seven cards come from a replayed natural match; fourteen cards are an authored overflow stress scenario. Setup backs up the existing local match. All gestures are then tested in the actual game UI.</p><button id="seven">Load seven-card replay</button><button id="many">Load fourteen-card stress scenario</button><button id="restore">Restore original match</button><p id="status"></p></main><script type="module">
const fixtures=await fetch('../data/hand-swipe-ui-fixtures.json').then(r=>r.json());
for(const key of ['seven','many'])document.querySelector('#'+key).onclick=()=>{if(sessionStorage.getItem('sorcery.swipeAudit.captured')!=='yes'){sessionStorage.setItem('sorcery.swipeAudit.original',localStorage.getItem('sorcery.match')??'__absent__');sessionStorage.setItem('sorcery.swipeAudit.captured','yes');}localStorage.setItem('sorcery.match',JSON.stringify(fixtures[key]));location.href='../battle.html?handSwipeAudit='+key;};
document.querySelector('#restore').onclick=()=>{if(sessionStorage.getItem('sorcery.swipeAudit.captured')!=='yes')return;const prior=sessionStorage.getItem('sorcery.swipeAudit.original');if(prior==='__absent__')localStorage.removeItem('sorcery.match');else localStorage.setItem('sorcery.match',prior);sessionStorage.removeItem('sorcery.swipeAudit.original');sessionStorage.removeItem('sorcery.swipeAudit.captured');document.querySelector('#status').textContent='Original match restored.';};
</script></html>
