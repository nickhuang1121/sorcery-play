<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語言介面驗證</title><style>body{background:#142126;color:#eee;font:16px/1.6 system-ui;padding:24px}button,a{display:block;margin:16px;padding:12px;color:inherit}pre{white-space:pre-wrap}</style><h1>語言介面驗證</h1><button id="home">備份並測試首次啟動</button><button id="opening">載入官方開局</button><button id="target">載入目標選擇</button><a href="../lobby.html">線上大廳</a><a href="../online-play.html">線上對局</a><button id="played-precast">實戰：施放前選擇</button><button id="played-activation">實戰：啟動前選擇</button><button id="played-ai-paused">首頁：AI 存檔暫停檢查</button><button id="played-draw">實戰：抽牌提示</button><button id="played-split">實戰：分配抽牌</button><button id="played-final">實戰：勝利結算</button><button id="verify-switch">檢查切換語言沒有改動對局</button><button id="restore">還原對局與語言設定</button><pre id="result"></pre><script type="module">
import {loadCards,officialBetaDecks} from '../src/cards.js';import {createPlayableMatch} from '../src/match-setup.js';import {dispatch} from '../src/engine.js';import {resolveUILanguage} from '../src/ui-language.js';
const keys=['sorcery.match','sorcery.uiLanguage','sorcery.cardLang','sorcery.aiDifficulty','sorcery.aiOmniscient'];
function backup(){if(!sessionStorage.getItem('sorcery.localeAudit'))sessionStorage.setItem('sorcery.localeAudit',JSON.stringify(Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]))));}
document.querySelector('#home').onclick=()=>{backup();localStorage.removeItem('sorcery.match');localStorage.removeItem('sorcery.uiLanguage');location.href='../index.html';};
document.querySelector('#opening').onclick=async()=>{backup();await loadCards();localStorage.setItem('sorcery.match',JSON.stringify(createPlayableMatch(officialBetaDecks().slice(0,2),42,'local')));location.href='../battle.html';};
document.querySelector('#target').onclick=async()=>{backup();const data=await fetch('../data/mobile-popup-response-fixtures.json').then(r=>r.json());localStorage.setItem('sorcery.match',JSON.stringify(data.defense));location.href='../battle.html';};
async function playedScene(kind){
 backup();await loadCards();const replay=await fetch('../data/english-mobile-played-match.json').then(r=>r.json());let state;
 if(kind==='final')state=replay.state;
 else{const d=officialBetaDecks();state=createPlayableMatch([d[1],d[2]],replay.seed,'ai');state.aiDifficulty=replay.state.aiDifficulty;state.aiOmniscient=replay.state.aiOmniscient;
 for(const action of replay.history){state=dispatch(state,action);if(kind==='ai-paused'&&state.active===1&&state.phase==='draw'||kind==='draw'&&state.phase==='draw'&&state.active===0||state.choice&&(kind==='precast'&&state.choice.player===0&&state.choice.title.includes('施放前選擇')||kind==='activation'&&state.choice.player===0&&state.choice.title.includes('啟動前選擇')||kind==='split'&&state.choice.title.includes('先宣告 Atlas'))){if(kind!=='ai-paused')state.mode='local';break;}}
 }
 const data=JSON.stringify(state);sessionStorage.setItem('sorcery.localeAudit.switchBefore',data);localStorage.setItem('sorcery.match',data);location.href='../battle.html';
}
for(const kind of ['precast','activation','split','draw','ai-paused','final'])document.querySelector('#played-'+kind).onclick=()=>playedScene(kind);
document.querySelector('#verify-switch').onclick=()=>{const baseline=sessionStorage.getItem('sorcery.localeAudit.switchBefore'),current=localStorage.getItem('sorcery.match');document.querySelector('#result').textContent=JSON.stringify({unchanged:baseline===current,phase:JSON.parse(current||'null')?.phase},null,2);};
document.querySelector('#restore').onclick=()=>{const data=JSON.parse(sessionStorage.getItem('sorcery.localeAudit')||'null');if(!data)return;for(const [k,v] of Object.entries(data)){if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}if(!Object.hasOwn(data,'sorcery.aiDifficulty'))localStorage.setItem('sorcery.aiDifficulty',JSON.stringify('medium'));sessionStorage.removeItem('sorcery.localeAudit.switchBefore');sessionStorage.removeItem('sorcery.localeAudit');document.querySelector('#result').textContent='已還原原有對局與語言設定。';};
document.querySelector('#result').textContent=JSON.stringify({device:navigator.languages,automatic:resolveUILanguage('auto',navigator.languages),zhTW:resolveUILanguage('auto',['zh-TW']),enUS:resolveUILanguage('auto',['en-US']),unsupported:resolveUILanguage('auto',['ja-JP']),manual:resolveUILanguage('zh-Hant',['en-US'])},null,2);
</script></html>
