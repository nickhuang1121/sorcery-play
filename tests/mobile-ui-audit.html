<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile UI / CONDUIT audit</title>
<style>body{background:#101916;color:#eee;font:14px/1.5 system-ui;margin:16px}button{font:inherit;padding:12px;margin:4px;border-radius:8px}main{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}iframe{width:390px;height:844px;border:1px solid #b69b65;background:#070b0c}aside{max-width:360px}pre{white-space:pre-wrap}li{padding:4px}</style>
<h1>手機介面與 CONDUIT 實際事件驗證</h1><p>載入測試對局會備份原有對局；完成後請還原。六類特效以正式遊戲內新增的 canvas 自動記錄。</p><button id="load">載入特效對局</button><button id="load-objects">載入神器目標對局</button><button id="restore">還原原有對局</button><p id="status"></p>
<main><iframe id="game" title="正式手機遊戲介面"></iframe><aside><ol><li>施放棕熊到 C1 → 施法與召喚</li><li>Bless 祝福剛召喚的棕熊 → 護盾</li><li>Zap 滋！打 C2 棕熊 → 命中</li><li>Lifewish → 治療</li><li>Fatality 打 C2 棕熊 → 退場</li></ol><pre id="evidence">尚未開始</pre><h2>拖曳高亮觀測</h2><pre id="drag-evidence">尚未拖曳</pre></aside></main>
<script type="module">
const frame=document.querySelector('#game'),dragSnapshots=[],counts={},required=['cast','hit','summon','shield','heal','depart'];let observer;
frame.onload=()=>{observer?.disconnect();const doc=frame.contentDocument;if(!doc?.body)return;observer=new MutationObserver(records=>{
 for(const record of records)for(const node of record.addedNodes)if(node.nodeType===1&&node.matches('.conduit-fx'))counts[node.dataset.effect]=(counts[node.dataset.effect]||0)+1;
 document.querySelector('#evidence').textContent=JSON.stringify({required,counts,allSixObserved:required.every(k=>counts[k]>0)},null,2);
 if(doc.body.classList.contains('is-dragging')){const sample={legal:[...doc.querySelectorAll('.cell.legal')].map(e=>Number(e.dataset.at)),validPreview:[...doc.querySelectorAll('.cell.preview')].map(e=>Number(e.dataset.at)),invalidPreview:[...doc.querySelectorAll('.cell.preview-invalid')].map(e=>Number(e.dataset.at))};if(JSON.stringify(sample)!==JSON.stringify(dragSnapshots.at(-1)))dragSnapshots.push(sample);document.querySelector('#drag-evidence').textContent=JSON.stringify(dragSnapshots.slice(-20),null,2);}
 });observer.observe(doc.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});};
async function loadFixture(file){if(sessionStorage.getItem('sorcery.uiAudit.originalCaptured')!=='yes'){sessionStorage.setItem('sorcery.uiAudit.original',localStorage.getItem('sorcery.match')??'__absent__');sessionStorage.setItem('sorcery.uiAudit.originalCaptured','yes');}const f=await fetch('../data/'+file).then(r=>r.json());localStorage.setItem('sorcery.match',JSON.stringify(f.state));for(const key of Object.keys(counts))delete counts[key];dragSnapshots.length=0;document.querySelector('#drag-evidence').textContent='尚未拖曳';frame.src='../index.html?mobileFxAudit=1';document.querySelector('#status').textContent='測試對局已載入，原有對局已備份。';}
document.querySelector('#load').onclick=()=>loadFixture('mobile-ui-fixture.json');
document.querySelector('#load-objects').onclick=()=>loadFixture('mobile-object-fixture.json');
document.querySelector('#restore').onclick=()=>{const prior=sessionStorage.getItem('sorcery.uiAudit.original');if(prior===null){document.querySelector('#status').textContent='沒有備份，未改動。';return;}if(prior==='__absent__')localStorage.removeItem('sorcery.match');else localStorage.setItem('sorcery.match',prior);sessionStorage.removeItem('sorcery.uiAudit.original');sessionStorage.removeItem('sorcery.uiAudit.originalCaptured');frame.src='about:blank';document.querySelector('#status').textContent='原有對局已還原。';};
</script></html>
