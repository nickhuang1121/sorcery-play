<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>統一彈窗 UI 驗證</title><link rel="stylesheet" href="../styles/game.css"><link rel="stylesheet" href="../styles/popup.css"><style>body{font:16px/1.6 system-ui;background:#142126;color:#eee;max-width:900px;margin:24px auto;padding:16px}button{font:inherit;margin:8px;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>統一彈窗 UI 驗證</h1><p>隔離場景僅用於介面驗證。效果確認由正式引擎出地點產生；勝利畫面載入先前完整實戰的結算存檔。會先備份原對局，測試後請還原。</p><button id="first-boot">載入首次啟動補測</button><button id="notice-site">載入行動提示：放置地點</button><button id="notice-deaths">載入行動提示：地點傷害與死亡</button><button id="realm-layout">載入攤開與堆疊補測</button><button id="defense">載入防禦補測</button><button id="intercept">載入攔截補測</button><button id="notice">測試資訊提示</button><button id="optional">載入村莊效果確認</button><button id="opening">載入官方開局</button><button id="result">載入實戰勝利結算</button><button id="inspect">檢查目前對局</button><button id="restore">還原原有對局</button><pre id="evidence"></pre><script type="module">
import {showNotice} from '../src/popup.js';
import {loadCards,card,officialBetaDecks} from '../src/cards.js';
import {restoreGame,legalActions,dispatch} from '../src/engine.js';
import {createPlayableMatch} from '../src/match-setup.js';
await loadCards();
document.querySelector('#first-boot').onclick=()=>{if(sessionStorage.getItem('sorcery.uiAudit.originalCaptured')!=='yes'){sessionStorage.setItem('sorcery.uiAudit.original',localStorage.getItem('sorcery.match')??'__absent__');sessionStorage.setItem('sorcery.uiAudit.originalCaptured','yes');}localStorage.removeItem('sorcery.match');location.href='../index.html?firstBootAudit=1';};
for(const kind of ['site','deaths'])document.querySelector('#notice-'+kind).onclick=async()=>load((await fetch('../data/action-notice-fixtures.json').then(r=>r.json()))[kind].state);
document.querySelector('#realm-layout').onclick=async()=>load((await fetch('../data/realm-layout-fixture.json').then(r=>r.json())).state);
for(const kind of ['defense','intercept'])document.querySelector('#'+kind).onclick=async()=>{const data=await fetch('../data/mobile-popup-response-fixtures.json').then(r=>r.json());load(data[kind]);};
document.querySelector('#notice').onclick=()=>showNotice('這是使用共用彈窗的連線或行動提示。',{title:'行動提示'});
function load(state){if(sessionStorage.getItem('sorcery.uiAudit.originalCaptured')!=='yes'){sessionStorage.setItem('sorcery.uiAudit.original',localStorage.getItem('sorcery.match')??'__absent__');sessionStorage.setItem('sorcery.uiAudit.originalCaptured','yes');}localStorage.setItem('sorcery.match',JSON.stringify(state));location.href='../index.html?popupAudit=1';}
document.querySelector('#optional').onclick=async()=>{const data=await fetch('../data/ui-audit-fixtures.json').then(r=>r.json());let s=restoreGame(data.fixtures.find(f=>f.id==='sparkmage-menu').state);s.board[12]=null;s.players[0].hand=[{uid:'popup-village',card:card('simple_village').id}];s=restoreGame(s);const a=legalActions(s,0).find(a=>a.type==='site'&&a.hand==='popup-village'&&a.at===12);if(!a)throw Error('No legal village action');load(dispatch(s,a));};
document.querySelector('#opening').onclick=()=>load(createPlayableMatch(officialBetaDecks().slice(0,2),42,'local'));
document.querySelector('#result').onclick=async()=>{const data=await fetch('../data/mobile-played-match.json').then(r=>r.json());load(data.state);};
document.querySelector('#inspect').onclick=()=>{const s=JSON.parse(localStorage.getItem('sorcery.match')||'null');document.querySelector('#evidence').textContent=JSON.stringify({phase:s?.phase,choice:s?.choice,spent:s?.players.map(p=>p.spent),units:s?.units.map(u=>({card:u.card,at:u.at,controller:u.controller})),winner:s?.winner,historyLength:s?.history.length},null,2);};
document.querySelector('#restore').onclick=()=>{const prior=sessionStorage.getItem('sorcery.uiAudit.original');if(prior===null)return;if(prior==='__absent__')localStorage.removeItem('sorcery.match');else localStorage.setItem('sorcery.match',prior);sessionStorage.removeItem('sorcery.uiAudit.original');sessionStorage.removeItem('sorcery.uiAudit.originalCaptured');document.querySelector('#evidence').textContent='原有對局已還原。';};
</script></html>
