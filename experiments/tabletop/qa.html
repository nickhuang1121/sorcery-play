<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>森境戰場 · QA</title><style>body{background:#11261f;color:#e3ebd6;font:14px/1.7 system-ui;margin:24px;max-width:720px}button,a{display:inline-block;padding:12px;margin:4px;border-radius:6px;color:#e5edda;background:#2a4b38;border:1px solid #abc59744;font:inherit}pre{white-space:pre-wrap}small{color:#a9c4ab}</style><h1>正式規則牌桌 · 測試工具</h1><p>只會載入獨立測試存檔，會先備份既有測試對局。正式版對局與牌組不會寫入。測試完成後請還原。</p><button id="combat" disabled>載入自然終局重播</button><button id="stack" disabled>載入上下層卡堆</button><button id="fx" disabled>載入六類特效局面</button><button id="restore">還原測試存檔</button><button id="verify">檢查正式存檔</button><a href="./battle.html">進入森境對戰</a><pre id="status" role="status">正在載入測試資料…</pre><script type="module">
const keys=['sorcery.match','sorcery.decks','sorcery.tutorial.v1'],prefix='sorcery.forestQA.',status=document.querySelector('#status');
const fixtures=await fetch('./qa-fixtures.json').then(r=>r.json());status.textContent='測試資料已就緒。';
for(const kind of ['combat','stack','fx']){const b=document.querySelector('#'+kind);b.disabled=false;b.onclick=()=>{if(sessionStorage.getItem(prefix+'captured')!=='yes'){sessionStorage.setItem(prefix+'original',localStorage.getItem('sorcery.tabletop.match')??'__absent__');sessionStorage.setItem(prefix+'production',JSON.stringify(keys.map(k=>[k,localStorage.getItem(k)])));sessionStorage.setItem(prefix+'captured','yes');}localStorage.setItem('sorcery.tabletop.match',JSON.stringify(fixtures[kind]));location.href='./battle.html?qa='+kind;};}
document.querySelector('#verify').onclick=()=>{const saved=sessionStorage.getItem(prefix+'production');if(!saved){status.textContent='沒有執行中的 QA 備份；正式版存檔未經此工具寫入。';return;}status.textContent=JSON.parse(saved).every(([k,v])=>localStorage.getItem(k)===v)?'正式版對局、牌組與教學存檔全部未改動。':'正式版存檔已變更，請檢查其他分頁是否正在進行對局。';};
document.querySelector('#restore').onclick=()=>{if(sessionStorage.getItem(prefix+'captured')!=='yes'){status.textContent='沒有測試存檔備份；沒有改動。';return;}const original=sessionStorage.getItem(prefix+'original');if(original==='__absent__')localStorage.removeItem('sorcery.tabletop.match');else localStorage.setItem('sorcery.tabletop.match',original);const preserved=JSON.parse(sessionStorage.getItem(prefix+'production')).every(([k,v])=>localStorage.getItem(k)===v);for(const suffix of ['captured','original','production'])sessionStorage.removeItem(prefix+suffix);status.textContent='原測試對局已還原。'+(preserved?'正式版對局、牌組與教學存檔全部未改動。':'請檢查其他遊戲分頁。');};
</script></html>
