<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b1b"><title>Sorcery · 森境牌桌</title><link rel="stylesheet" href="./tabletop.css"></head>
<body>
<main class="scene" id="scene">
 <div class="environment" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div><div class="embers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
 <header class="scene-heading"><span class="eyebrow">SORCERY · CONTESTED REALM</span><h1 data-copy="title">森境交界</h1><span class="scene-subtitle" data-copy="subtitle">THE VERDANT THRESHOLD</span></header>
 <div class="prototype-mark" data-copy="preview">場景試玩</div><button class="menu-button round" id="menu" aria-label="開啟選單">☰</button>
 <section class="portrait-group opponent" aria-label="對手資訊"><button class="avatar" id="opponent-info"><img id="opponent-art" alt=""><span class="life" id="opponent-life">18</span></button><div class="player-copy"><small data-copy="opponent">你的對手</small><strong data-copy="opponentName">灰燼賢者</strong><span class="mana"><i></i><i></i><i></i><i class="spent"></i><b>3 / 4</b></span></div></section>
 <div class="opponent-hand" aria-label="對手手牌"></div>
 <button class="deck deck-enemy" data-pile="opponent"><span class="card-back"><i>✧</i></span><b>24</b><small data-copy="spellbook">法術牌庫</small></button>
 <div class="table-region"><div class="stone-table"><div class="board" id="board" aria-label="5 × 4 領域戰場"></div></div></div>
 <aside class="turn-area"><span class="turn-caption" id="turn-caption">你的回合</span><button class="turn-orb" id="end-turn"><span data-copy="end">結束<br>回合</span></button><span class="turn-count" id="turn-count">ROUND 04</span></aside>
 <section class="portrait-group own" aria-label="玩家資訊"><button class="avatar" id="own-info"><img id="own-art" alt=""><span class="life" id="own-life">20</span></button><div class="player-copy"><small data-copy="you">領域行者</small><strong data-copy="yourName">你 · 地術師</strong><span class="mana"><i></i><i></i><i></i><i></i><b id="mana-value">4 / 4</b></span></div></section>
 <button class="deck deck-atlas" data-pile="atlas"><span class="card-back"><i>◇</i></span><b>13</b><small>ATLAS</small></button>
 <button class="deck deck-own" data-pile="spells"><span class="card-back"><i>✧</i></span><b>28</b><small>SPELLBOOK</small></button>
 <button class="grave" data-pile="grave"><span>☠</span><b>3</b><small data-copy="grave">墓地</small></button>
 <div class="hand-area"><div class="hand-caption"><span data-copy="hand">你的手牌</span><i></i><span id="hand-count">7</span></div><div class="hand" id="hand" aria-label="你的手牌"></div></div>
 <div class="action-hint" id="action-hint" aria-live="polite"></div><button class="cancel-choice" id="cancel-choice" hidden data-copy="cancel">取消選擇</button>
 <div class="announcement" id="announcement" role="status" aria-live="polite"></div>
 <div class="drag-ghost" id="drag-ghost" aria-hidden="true"></div>
</main>
<dialog id="modal"><button class="modal-close round" id="modal-close" aria-label="關閉">×</button><div id="modal-content"></div></dialog>
<script type="module" src="./tabletop.js"></script>
</body></html>
